# Adapted from r-lib/actions/examples/pkgdown.yaml
# https://github.com/r-lib/actions/tree/v2/examples
#
# NOTE: this workflow PUBLISHES the site on every push to main: it builds it
# and pushes the result to the gh-pages branch. GitHub serves that branch once
# Pages is enabled for the repository (Settings > Pages > Source: Deploy from
# a branch > gh-pages, / (root)); until then the site is built but not served.
#
# Two jobs, so that the token that can write to the repository is never in
# reach of the steps that install packages and run code: `build` reads only
# and hands the built site over as an artifact; `deploy` writes, and runs
# nothing but the checkout, the download and the deploy action.
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: docs
          # build_site_github_pages() writes docs/.nojekyll, which the
          # upload would otherwise leave out (its default is false)
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    permissions:
      contents: write
    steps:
      # the deploy action pushes with its own `token` input (by default the
      # repository-scoped token), so the checkout keeps no credentials
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: docs

      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          # the site is rebuilt whole each time, so files the build no longer
          # makes (a page for a removed .md, say) are deleted from gh-pages
          clean: true
          branch: gh-pages
          folder: docs
