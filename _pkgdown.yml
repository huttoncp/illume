url: https://craig-hutton.github.io/illume/
template:
  bootstrap: 5
  bslib:
    primary: "#2a6f97"

home:
  title: Exploration and frequentist inference in one toolkit

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]

articles:
- title: Start here
  navbar: ~
  contents:
  - illume
  - workflow
- title: Modelling
  navbar: Modelling
  contents:
  - regression-models
  - causal-models
  - effect-size-and-power
- title: Exploration
  navbar: Exploration
  contents:
  - exploring-data
  - profiling
  - anomaly-detection
  - missing-data

reference:
