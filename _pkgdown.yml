url: https://huttoncp.github.io/illume/
template:
  bootstrap: 5
  bslib:
    primary: "#2a6f97"

home:
  title: A Unified Engine for Exploration and Frequentist Inference

navbar:
  structure:
    left:  [intro, reference, articles, news, illumex]
    right: [search, github]
  components:
    illumex:
      text: Exploration (illumex)
      href: https://huttoncp.github.io/illumex/

articles:
- title: Start here
  navbar: ~
  contents:
  - illume
  - workflow
  - benchmarking
- title: Modelling
  navbar: Modelling
  contents:
  - regression-models
  - causal-models
  - effect-size-and-power
  - anova
  - moderation
  - missing-data

reference:
- title: "Fitting models"
  desc: >
    One engine, every family. The formula is lme4's and the object that comes back is the same whatever was fitted.
  contents:
  - ilm_ar1
  - ilm_car1
  - ilm_censor
  - ilm_cyclic
  - ilm_family
  - ilm_fit
  - ilm_fourier
  - ilm_model
  - ilm_squeeze
  - ilm_surv
  - ilm_thresholds
- title: "Other designs"
  desc: >
    Identification strategies and sampling designs that are not a single regression.
  contents:
  - ilm_design
  - ilm_did
  - ilm_iv
  - ilm_iv_ar
  - ilm_mediate
  - ilm_mediate_sens
  - ilm_rdd
  - ilm_svy_coef
  - ilm_svy_vcov
- title: "Diagnostics"
  desc: >
    Each check reports whether an assumption is consistent with the data, and names a remedy that exists in this package when it is not.
  contents:
  - ilm_apply_remedy
  - ilm_appraise
  - ilm_binned_residuals
  - ilm_calibration
  - ilm_check_ar
  - ilm_check_collinearity
  - ilm_check_covariate
  - ilm_check_dispersion
  - ilm_check_omitted
  - ilm_check_predictive
  - ilm_check_proportional
  - ilm_check_variance
  - ilm_check_zeros
  - ilm_consistency
  - ilm_re_mahalanobis
  - ilm_remedies
  - ilm_rqr
  - ilm_rqr_test
  - ilm_scores
  - ilm_variogram
- title: "ANOVA"
  desc: >
    Factorial and repeated-measures designs, specified by naming columns rather than by writing a formula with an error term.
  contents:
  - ilm_aov_ez
- title: "Inference and interpretation"
  desc: >
    What the model says, on a scale someone can read.
  contents:
  - ilm_ame
  - ilm_anova
  - ilm_coef_table
  - ilm_contrast
  - ilm_denom_df
  - ilm_effects
  - ilm_emmeans
  - ilm_interpret
  - ilm_moderation
  - ilm_pb_lrt
  - ilm_plot_moderation
  - ilm_robust
  - ilm_rp_lrt
  - ilm_scenario
  - ilm_trends
  - ilm_vcov_cluster
  - ilm_zi_coef
  - ilm_zi_prob
- title: "Design and power"
  desc: >
    Before the data exist.
  contents:
  - ilm_scaffold
  - ilm_power_design
  - ilm_power
  - ilm_power_n
  - plot.ilm_power
- title: "Missing data"
  desc: >
    Filling it in honestly, and pooling across the imputations. Describing it is illumex's: ilm_check_missing().
  contents:
  - ilm_impute
  - ilm_mi_pool
- title: "Causal models"
  desc: >
    A DAG, what it implies, and what it licenses you to say.
  contents:
  - ilm_adjust_sets
  - ilm_dag
  - ilm_dag_implied
  - ilm_dag_model
  - ilm_dag_test
  - ilm_dsep
- title: "Plots"
  desc: >
    Plots of a fitted model, built on tinyplot. Plots of the data themselves are illumex's.
  contents:
  - ilm_plot_acf
  - ilm_plot_did
  - ilm_plot_model
  - ilm_plot_rdd
  - ilm_plot_survival
  - ilm_plot_variogram
- title: "Simulation"
  desc: >
    Draws from a fitted model. Example data with a known structure, ilm_sim(), is illumex's.
  contents:
  - ilm_fitted
  - ilm_simulate
  - ilm_survival
- title: "Working with other packages"
  desc: >
    Registration shims and the methods that let the wider ecosystem dispatch on an illume fit.
  contents:
  - AIC.ilm_model
  - Anova.ilm_model
  - check_model.ilm_model
  - coef.ilm_model
  - fixef.ilm_model
  - get_coef.ilm_model
  - ilm_register_insight
  - ilm_register_marginaleffects
  - logLik.ilm_model
  - model_performance.ilm_model
  - plot.ilm_model
  - predict.ilm_model
  - print.ilm_model
  - summary.ilm_model
  - terms.ilm_model
- title: "Shared parameters and print methods"
  desc: >
    Documentation shared across functions, and methods you call by printing rather than by name.
  contents:
  - print.ilm_censor
  - print.ilm_cor
